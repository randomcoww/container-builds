name: muse-glimmer-30b-ud-q8-k-xl build
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  TARGET: muse-glimmer-30b-ud-q8-k-xl

jobs:
  build:
    runs-on: oras-${{ github.event.repository.name }}
    container:
      image: ghcr.io/oras-project/oras:v1.3.4@sha256:f7bc056d54d97baa399414ed5048ecc67c3371b750d4bbce1d871827a5758179
    steps:
    - name: Build and release container
      run: |
        set -eo pipefail

        wget -q "https://huggingface.co/unsloth/Muse-Glimmer-30B-GGUF/resolve/main/Muse-Glimmer-30B-UD-Q8_K_XL.gguf"
        wget -q "https://huggingface.co/unsloth/Muse-Glimmer-30B-GGUF/resolve/main/mmproj-Muse-Glimmer-30B-BF16.gguf"
        oras push \
          --ca-file /etc/oras/tls/ca.crt \
          --cert-file /etc/oras/tls/tls.crt \
          --key-file /etc/oras/tls/tls.key \
          $INTERNAL_REGISTRY/${{ github.repository_owner }}/${{ env.TARGET }}:v$(date -u +%s) \
          Muse-Glimmer-30B-UD-Q8_K_XL.gguf \
          mmproj-Muse-Glimmer-30B-BF16.gguf