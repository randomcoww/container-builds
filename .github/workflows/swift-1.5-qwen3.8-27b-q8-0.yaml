name: swift-1.5-qwen3.8-27b-q8-0 build
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  TARGET: swift-1.5-qwen3.8-27b-q8-0

jobs:
  build:
    runs-on: oras-${{ github.event.repository.name }}
    container:
      image: ghcr.io/oras-project/oras:v1.3.6@sha256:9cfb578be975b762fd898b9d004243d8003aeb807a3e15b2ed212cdd1326c9eb
    steps:
    - name: Build and release container
      run: |
        set -eo pipefail

        wget -q "https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-27B-GGUF/resolve/main/Swift-1.5-Qwen3.8-27B-Q8_0.gguf"
        wget -q "https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-27B-GGUF/resolve/main/mmproj-Swift-1.5-Qwen3.8-27B-F16.gguf"
        oras push \
          --ca-file /etc/oras/tls/ca.crt \
          --cert-file /etc/oras/tls/tls.crt \
          --key-file /etc/oras/tls/tls.key \
          $INTERNAL_REGISTRY/${{ github.repository_owner }}/${{ env.TARGET }}:v$(date -u +%s) \
          Swift-1.5-Qwen3.8-27B-Q8_0.gguf:application/octet-stream \
          mmproj-Swift-1.5-Qwen3.8-27B-F16.gguf:application/octet-stream